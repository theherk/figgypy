[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figgypy"
version = "2.0.0"
description = "Simple configuration tool. Get config from yaml, json, or xml."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Adam Sherwood", email = "theherk@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "boto3",
    "python-gnupg",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/theherk/figgypy"
Repository = "https://github.com/theherk/figgypy"
Issues = "https://github.com/theherk/figgypy/issues"

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
